<div class="container">
    <div class="row">
        <div class="col">
            <div *ngFor="let stream of streams$ | async">
                <a [href]="playerSource + '/' + stream.stream_id">{{stream.name}}</a>
            </div>
            
        </div>
        <div class="col">
            <a class="btn btn-primary" [href]="playlistUrl" target="_blank" download="playlist.m3u"> Download M3U Playlist </a>
        </div>
    </div>
</div>
